<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORÉ — L'origine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; color: #F5EFE6; }

  /* ============ INTRO STAGE ============ */
  .intro {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    overflow: hidden;
  }

  /* Grain overlay */
  .grain {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.35'/></svg>");
    opacity: 0.22;
    pointer-events: none;
    mix-blend-mode: overlay;
    z-index: 10;
  }

  /* Radial vignette + soft pink glow following elephant */
  .glow {
    position: absolute;
    width: 900px; height: 900px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 140, 180, 0.20) 0%, rgba(255, 140, 180, 0.05) 30%, transparent 70%);
    filter: blur(50px);
    animation: breathe 6s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  /* Mirror floor */
  .floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 40vh;
    background: linear-gradient(to bottom, transparent 0%, rgba(255, 140, 180, 0.04) 50%, rgba(180, 130, 90, 0.06) 100%);
    z-index: 2;
  }

  /* Gold dust particles */
  .dust {
    position: absolute;
    width: 3px; height: 3px;
    background: #D4A574;
    border-radius: 50%;
    box-shadow: 0 0 6px #D4A574;
    animation: float linear infinite;
    z-index: 3;
  }
  @keyframes float {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(var(--drift, 20px)); opacity: 0; }
  }

  /* Elephant stage — now holds the video */
  .elephant-stage {
    position: relative;
    width: min(70vw, 800px);
    height: min(70vw, 800px);
    max-height: 80vh;
    z-index: 5;
    display: block;
    object-fit: contain;
    animation: elephantEntrance 3s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both,
               levitate 5s ease-in-out 3.5s infinite;
    /* if your video has a dark bg, screen blend fuses it with the page */
    mix-blend-mode: screen;
    filter: drop-shadow(0 40px 80px rgba(255, 100, 150, 0.35));
  }

  @keyframes elephantEntrance {
    0%   { opacity: 0; transform: scale(0.3) translateY(80px); filter: blur(30px) drop-shadow(0 40px 80px rgba(255, 100, 150, 0.35)); }
    60%  { opacity: 1; filter: blur(0) drop-shadow(0 40px 80px rgba(255, 100, 150, 0.35)); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0) drop-shadow(0 40px 80px rgba(255, 100, 150, 0.35)); }
  }

  @keyframes levitate {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-18px); }
  }

  /* ============ WORDMARK REVEAL ============ */
  .wordmark {
    position: absolute;
    bottom: 12vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    text-align: center;
  }

  .wordmark h1 {
    font-family: 'Times New Roman', serif;
    font-size: clamp(80px, 12vw, 180px);
    font-weight: 300;
    letter-spacing: 0.15em;
    line-height: 1;
    background: linear-gradient(180deg, #F5EFE6 0%, #D4A574 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .wordmark h1 span {
    display: inline-block;
    opacity: 0;
    transform: translateY(40px);
    animation: letterUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .wordmark h1 span:nth-child(1) { animation-delay: 4.0s; }
  .wordmark h1 span:nth-child(2) { animation-delay: 4.18s; }
  .wordmark h1 span:nth-child(3) { animation-delay: 4.36s; }
  .wordmark h1 span:nth-child(4) { animation-delay: 4.54s; }

  @keyframes letterUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .tagline {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(245, 239, 230, 0.55);
    opacity: 0;
    animation: fadeIn 1.5s ease 5.8s forwards;
  }

  .enter-btn {
    margin-top: 44px;
    padding: 14px 34px;
    background: transparent;
    border: 1px solid rgba(212, 165, 116, 0.5);
    color: #D4A574;
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    animation: fadeIn 1.5s ease 6.3s forwards;
    transition: all 0.4s ease;
    font-family: inherit;
  }
  .enter-btn:hover {
    background: #D4A574;
    color: #000;
    letter-spacing: 0.45em;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  /* Shockwave rings */
  .shockwave {
    position: absolute;
    left: 50%; top: 50%;
    width: 100px; height: 100px;
    border: 1px solid rgba(212, 165, 116, 0.6);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: shockwave 4.5s ease-out infinite;
    z-index: 4;
    pointer-events: none;
  }
  @keyframes shockwave {
    0%   { width: 100px; height: 100px; opacity: 0; }
    50%  { opacity: 0.8; }
    100% { width: 1800px; height: 1800px; opacity: 0; border-color: rgba(255, 140, 180, 0); }
  }

  /* Corner labels */
  .corner {
    position: absolute;
    top: 30px; left: 40px;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: rgba(245, 239, 230, 0.45);
    z-index: 10;
    opacity: 0;
    animation: fadeIn 1s ease 6.8s forwards;
  }
  .corner-right {
    left: auto; right: 40px;
  }
</style>
</head>
<body>

<div class="intro" id="intro">

  <div class="corner">EST. 2026 — ABIDJAN</div>
  <div class="corner corner-right">KORÉ 001 / L'ORIGINE</div>

  <div class="glow"></div>
  <div class="floor"></div>
  <div class="grain"></div>

  <div class="shockwave"></div>
  <div class="shockwave" style="animation-delay: 2.25s;"></div>

  <!-- ELEPHANT VIDEO -->
  <video autoplay loop muted playsinline class="elephant-stage">
    <source src="assets/elephant-loop.mp4" type="video/mp4">
  </video>

  <!-- WORDMARK -->
  <div class="wordmark">
    <h1><span>K</span><span>O</span><span>R</span><span>É</span></h1>
    <p class="tagline">L'origine · sculptée · portée</p>
    <button class="enter-btn" onclick="enterSite()">Entrer</button>
  </div>

</div>

<script>
  const intro = document.getElementById('intro');

  // Gold dust particles
  for (let i = 0; i < 45; i++) {
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = Math.random() * 100 + '%';
    d.style.bottom = -Math.random() * 200 + 'px';
    d.style.animationDuration = (8 + Math.random() * 12) + 's';
    d.style.animationDelay = Math.random() * 8 + 's';
    d.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
    d.style.opacity = 0.3 + Math.random() * 0.6;
    intro.appendChild(d);
  }

  function enterSite() {
    intro.style.transition = 'opacity 1.2s ease, transform 1.2s ease';
    intro.style.opacity = '0';
    intro.style.transform = 'scale(1.15)';
    setTimeout(() => {
      intro.style.display = 'none';
      document.body.style.overflow = 'auto';
      // Home KORÉ à construire ensuite
      document.body.innerHTML += '<div style="padding:80px;font-family:serif;font-size:28px;color:#F5EFE6;background:#000;min-height:100vh;">[Home KORÉ — prochaine étape]</div>';
    }, 1200);
  }
</script>

</body>
</html>
