<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORÉ — L'origine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; color: #F5EFE6; }

  .intro {
    position: fixed; inset: 0;
    background: #000;
    z-index: 100;
    overflow: hidden;
    cursor: pointer;
  }

  .elephant-video {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 1;
  }

  .vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 20%, transparent 70%, rgba(0,0,0,0.7) 100%);
    z-index: 2;
    pointer-events: none;
  }

  .grain {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.35'/></svg>");
    opacity: 0.18;
    pointer-events: none;
    mix-blend-mode: overlay;
    z-index: 3;
  }

  .corner {
    position: absolute;
    top: 30px; left: 40px;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: rgba(245, 239, 230, 0.7);
    z-index: 10;
    opacity: 0;
    animation: fadeIn 1.5s ease 1s forwards;
  }
  .corner-right { left: auto; right: 40px; }

  .wordmark {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    text-align: center;
    opacity: 0;
    animation: fadeIn 2s ease 3s forwards;
  }
  .wordmark h1 {
    font-family: 'Times New Roman', serif;
    font-size: clamp(60px, 9vw, 140px);
    font-weight: 300;
    letter-spacing: 0.18em;
    line-height: 1;
    background: linear-gradient(180deg, #F5EFE6 0%, #D4A574 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tagline {
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(245, 239, 230, 0.7);
  }

  .skip-hint {
    position: absolute;
    bottom: 30px; right: 40px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(245, 239, 230, 0.6);
    display: flex; align-items: center; gap: 12px;
    opacity: 0;
    animation: fadeIn 1s ease 2s forwards;
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .skip-hint:hover { color: #D4A574; }
  .skip-hint kbd {
    display: inline-block;
    padding: 4px 10px;
    border: 1px solid rgba(245, 239, 230, 0.4);
    border-radius: 4px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.2em;
  }

  .sound-gate {
    position: absolute;
    top: 30px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    padding: 12px 24px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(212, 165, 116, 0.5);
    color: #D4A574;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s ease;
    display: none;
  }
  .sound-gate.show { display: block; animation: fadeIn 0.6s ease forwards; }
  .sound-gate:hover { background: #D4A574; color: #000; }

  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

<div class="intro" id="intro">

  <video id="elephantVideo" class="elephant-video" autoplay loop muted playsinline>
    <source src="assets/elephant-loop.mp4" type="video/mp4">
  </video>

  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="corner">EST. 2026 — ABIDJAN</div>
  <div class="corner corner-right">KORÉ 001 / L'ORIGINE</div>

  <button class="sound-gate" id="soundGate">🔊 Activer le son</button>

  <div class="wordmark">
    <h1>KORÉ</h1>
    <p class="tagline">L'origine · sculptée · portée</p>
  </div>

  <div class="skip-hint" onclick="enterSite()">
    Passer <kbd>Espace</kbd>
  </div>

</div>

<script>
  const intro = document.getElementById('intro');
  const video = document.getElementById('elephantVideo');
  const soundGate = document.getElementById('soundGate');

  // Muted autoplay (always allowed by browsers).
  video.volume = 1.0;
  video.play().catch(err => console.log('play error:', err));

  // Show sound gate after 500ms so user knows they can enable sound
  setTimeout(() => {
    if (video.muted) soundGate.classList.add('show');
  }, 500);

  // Activate sound on ANY click in the intro
  function activateSound() {
    if (video.muted) {
      video.muted = false;
      video.volume = 1.0;
      soundGate.style.display = 'none';
    }
  }

  intro.addEventListener('click', activateSound);
  soundGate.addEventListener('click', (e) => {
    e.stopPropagation();
    activateSound();
  });

  // Space to skip
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      enterSite();
    }
  });

  function enterSite() {
    intro.style.transition = 'opacity 1.2s ease, transform 1.2s ease';
    intro.style.opacity = '0';
    intro.style.transform = 'scale(1.1)';
    setTimeout(() => {
      intro.style.display = 'none';
      video.pause();
      document.body.style.overflow = 'auto';
      document.body.innerHTML += '<div style="padding:80px;font-family:serif;font-size:28px;color:#F5EFE6;background:#000;min-height:100vh;">[Home KORÉ — prochaine étape]</div>';
    }, 1200);
  }
</script>

</body>
</html>
